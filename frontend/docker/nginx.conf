# VERINEX 官网 Nginx 配置（web 服务）
# 职责：托管 Vue 构建产物；将 /api 与 /health 反代到 api 容器；同源部署避免宽泛 CORS。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # 基础安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml font/woff2;

    client_max_body_size 1m;

    # API 反向代理（docs/ARCHITECTURE.md 13）
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /health/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    # 站点地图由后端依据已发布内容生成
    location = /sitemap.xml {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=600";
    }

    # 带内容哈希的静态资源可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:ico|svg|png|jpe?g|webp|avif|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # SPA 回退：优先命中构建期预渲染的独立 HTML（/zh/index.html、/zh/about/index.html），
    # 其余深层路由（详情页）回退到应用外壳由前端渲染。
    # HTML 一律 no-cache（必须回源 revalidate），否则旧 HTML 引用已删除的旧哈希资源，
    # 重新部署后浏览器会继续展示旧版本页面。带哈希的 /assets/ 仍可长期缓存。
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
}
